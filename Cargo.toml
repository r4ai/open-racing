[workspace]
resolver = "3"
members = ["crates/sim", "crates/env", "crates/api", "crates/track", "crates/car", "crates/ac", "crates/train-burn", "crates/app", "crates/track-render", "crates/track-project", "crates/editor", "crates/sky", "crates/engine-sim", "crates/machine-project", "crates/machine-editor", "crates/polyhaven"]
default-members = ["crates/sim", "crates/env", "crates/api", "crates/track", "crates/car", "crates/ac", "crates/track-project", "crates/engine-sim", "crates/machine-project", "crates/polyhaven"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
open-racing-sim = { path = "crates/sim" }
open-racing-env = { path = "crates/env" }
open-racing-api = { path = "crates/api" }
open-racing-track = { path = "crates/track" }
open-racing-car = { path = "crates/car" }
open-racing-ac = { path = "crates/ac" }
open-racing-track-render = { path = "crates/track-render" }
open-racing-track-project = { path = "crates/track-project" }
open-racing-sky = { path = "crates/sky" }
open-racing-engine-sim = { path = "crates/engine-sim" }
open-racing-machine-project = { path = "crates/machine-project" }
open-racing-polyhaven = { path = "crates/polyhaven" }
bevy = { version = "0.19", features = ["serialize", "dds", "pbr_light_textures"] }
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
serde_json = "1"
rayon = "1.12"
criterion = "0.8"
clap = { version = "4.6", features = ["derive"] }

# Only line tables for our own crates: panics and backtraces keep their file and line,
# while builds, links and each worktree's target/ shrink without the full debug info.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# The track editor rebuilds the whole track in the background on every edit: its
# builder runs optimised, so long circuits show edits in a fraction of a second.
[profile.dev.package.open-racing-track-project]
opt-level = 3

# The machine tool's engine simulator solves the gas dynamics of a whole engine in real
# time, and its projects bake cars through it: both run optimised in dev builds too.
[profile.dev.package.open-racing-engine-sim]
opt-level = 3

[profile.dev.package.open-racing-machine-project]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.bench]
inherits = "release"
