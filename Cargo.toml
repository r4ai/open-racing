[workspace]
resolver = "3"
members = ["crates/sim", "crates/env", "crates/api", "crates/train-burn", "crates/app"]
default-members = ["crates/sim", "crates/env", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
open-racing-sim = { path = "crates/sim" }
open-racing-env = { path = "crates/env" }
open-racing-api = { path = "crates/api" }
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
rayon = "1.12"
criterion = "0.8"
clap = { version = "4.6", features = ["derive"] }

[profile.release]
lto = "thin"

[profile.dev.package."*"]
opt-level = 3

[profile.bench]
inherits = "release"
