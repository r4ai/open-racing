dev = ["bevy/dynamic_linking"]

[dependencies]
open-racing-machine-project.workspace = true
open-racing-engine-sim.workspace = true
bevy.workspace = true
bevy_egui = "0.42"
glam.workspace = true
serde_json.workspace = true
clap.workspace = true
