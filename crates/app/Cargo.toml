[package]
name = "open-racing-app"
description = "Bevy front-end: drive, watch AI agents, visualise the simulation"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["burn-policy"]
# Watch agents trained with the Burn trainer.
burn-policy = ["dep:open-racing-train-burn"]
# Faster incremental builds while developing: links Bevy as a DLL. Not for release builds.
dev = ["bevy/dynamic_linking"]

[dependencies]
open-racing-sim.workspace = true
open-racing-api.workspace = true
open-racing-track.workspace = true
open-racing-car.workspace = true
open-racing-train-burn = { path = "../train-burn", optional = true }
bevy = { version = "0.19", features = ["serialize", "dds"] }
serde.workspace = true
ron.workspace = true
glam.workspace = true
clap.workspace = true
raw-window-handle = "0.6"
bevy_mod_openxr = "0.6"
bevy_mod_xr = "0.6"
openxr = { version = "0.21", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Devices_HumanInterfaceDevice", "Win32_Foundation", "Win32_System_LibraryLoader"] }
