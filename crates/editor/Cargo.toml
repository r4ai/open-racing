[package]
name = "open-racing-editor"
description = "Track editor: build circuits from road splines, kerbs, walls and markers, and bake them into track packages"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Faster incremental builds while developing: links Bevy as a DLL. Not for release builds.
dev = ["bevy/dynamic_linking"]

[dependencies]
open-racing-sim.workspace = true
open-racing-track.workspace = true
open-racing-track-project.workspace = true
open-racing-track-render.workspace = true
bevy.workspace = true
bevy_egui = "0.42"
glam.workspace = true
ron.workspace = true
serde_json.workspace = true
serde.workspace = true
clap.workspace = true
rfd = "0.17.2"
